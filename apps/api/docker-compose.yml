services:
  postgres:
    image: postgres:17
    container_name: pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    volumes:
      - pos-postgres-data:/var/lib/postgresql/data

volumes:
  pos-postgres-data: